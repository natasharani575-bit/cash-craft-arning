<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CashCraft - Complete Referral Link & Team System</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body { background: #0a0f1d; color: #fff; padding-bottom: 70px; }
.app-container { max-width: 600px; margin: auto; background: #0f1c3f; border-radius: 0 0 14px 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); overflow: hidden; border: 1px solid #1e3a8a; min-height: 100vh; display: flex; flex-direction: column; position: relative; }
.navbar { background: #172554; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e40af; position: sticky; top: 0; z-index: 100; }
.logo { font-size: 18px; font-weight: bold; color: #60a5fa; }
.user-info { font-size: 12px; color: #93c5fd; }
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 600px; margin: auto; background: #0b132b; display: flex; justify-content: space-around; padding: 8px 0; border-top: 1px solid #1d4ed8; z-index: 1000; }
.nav-item { background: transparent; border: none; color: #93c5fd; display: flex; flex-direction: column; align-items: center; font-size: 9px; cursor: pointer; flex: 1; }
.nav-item span.icon { font-size: 16px; margin-bottom: 2px; }
.nav-item.active { color: #60a5fa; font-weight: bold; }
.content { flex: 1; padding: 20px; overflow-y: auto; }
.card { background: #172554; padding: 16px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #1e40af; }
.card h3 { color: #f8fafc; font-size: 16px; margin-bottom: 10px; border-bottom: 1px solid #1e40af; padding-bottom: 6px; }
input, select { width: 100%; padding: 12px; margin: 6px 0 12px 0; background: #0a0f1d; border: 1px solid #3b82f6; border-radius: 8px; color: #fff; font-size: 14px; }
.btn { background: #2563eb; color: white; border: none; padding: 12px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 14px; }
.btn-success { background: #059669; }
.btn-danger { background: #dc2626; }
.chat-messages { height: 200px; background: #0a0f1d; border: 1px solid #1e40af; border-radius: 8px; padding: 8px; overflow-y: auto; margin-bottom: 6px; }
.msg { padding: 6px 10px; margin: 4px 0; border-radius: 8px; max-width: 85%; font-size: 11px; }
.msg-user { background: #1e3a8a; margin-left: auto; }
.msg-admin { background: #1e293b; margin-right: auto; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th, td { border: 1px solid #1e40af; padding: 8px; text-align: center; font-size: 11px; }
th { background: #172554; color: #93c5fd; }
.error-box { background: #7f1d1d; color: #fca5a5; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 12px; font-size: 13px; }
.link-text { color: #60a5fa; cursor: pointer; text-align: center; margin-top: 12px; font-size: 13px; }
.slider-container { position: relative; width: 100%; height: 320px; border-radius: 12px; overflow: hidden; margin-bottom: 15px; background: #0a0f1d; }
.slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1s ease-in-out; display: flex; flex-direction: column; justify-content: flex-end; background-size: cover; background-position: center; }
.slide.active { opacity: 1; }
.slide-caption { background: rgba(10, 15, 29, 0.85); color: #fff; padding: 12px 15px; font-size: 12px; text-align: center; }
.slide-caption b { color: #60a5fa; display: block; font-size: 14px; }
</style>
</head>
<body>
<div class="app-container">
<div class="navbar"><div class="logo">💎 CashCraft</div><div class="user-info" id="nav-user">Loading...</div></div>
<div class="content" id="app"></div>
<div class="bottom-nav" id="bottom-nav" style="display:none">
<button class="nav-item active" id="tab-dashboard" onclick="switchTab('dashboard')"><span class="icon">🏠</span>Home</button>
<button class="nav-item" id="tab-team" onclick="switchTab('team')"><span class="icon">👥</span>Team</button>
<button class="nav-item" id="tab-tasks" onclick="switchTab('tasks')"><span class="icon">📋</span>Tasks</button>
<button class="nav-item" id="tab-wheel" onclick="switchTab('wheel')"><span class="icon">🎡</span>Wheel</button>
<button class="nav-item" id="tab-wallet" onclick="switchTab('wallet')"><span class="icon">💰</span>Wallet</button>
<button class="nav-item" id="tab-chat" onclick="switchTab('chat')"><span class="icon">💬</span>Chat</button>
</div>
</div>
<script>
const SUPABASE_URL = "https://qgmucqsefphoapgljjia.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_TykY2iZl-jZC89NeZ80Xkg_i4vRCx63";
const headers = {"apikey":SUPABASE_PUBLISHABLE_KEY,"Authorization":"Bearer "+SUPABASE_PUBLISHABLE_KEY,"Content-Type":"application/json","Prefer":"return=representation"};
let defaultAdmin = { name: 'Admin Master', email: 'Natasha.lee@gmail.com', pass: 'NatashaAli12345', balance: 1000, investment: 0, profit: 0, approved: 1, ref: 'ADMIN', referredBy: '', count: 0, level: 1, lastTaskDate: '', taskReward: 0.35, wheelBalance: 0, withdrawals: [] };
async function fetchUsersFromDB(){try{let res=await fetch(`${SUPABASE_URL}/rest/v1/cashcraft_users?select=*`,{headers});if(res.ok){let data=await res.json();if(data&&data.length>0){let list=data.map(x=>x.data||x);if(!list.some(x=>x.email.toLowerCase()==='natasha.lee@gmail.com'))list.unshift(defaultAdmin);return list;}}}catch(e){}return[defaultAdmin];}
async function saveSingleUser(user){await fetch(`${SUPABASE_URL}/rest/v1/cashcraft_users`,{method:'POST',headers:{...headers,"Prefer":"resolution=merge-duplicates"},body:JSON.stringify({email:user.email.toLowerCase(),data:user})});}
async function fetchChatsFromDB(){try{let res=await fetch(`${SUPABASE_URL}/rest/v1/cashcraft_chats?id=eq.1&select=*`,{headers});if(res.ok){let d=await res.json();if(d.length>0)return d[0].messages||[];}}catch(e){}return[];}
async function saveChatsToDB(list){await fetch(`${SUPABASE_URL}/rest/v1/cashcraft_chats`,{method:'POST',headers:{...headers,"Prefer":"resolution=merge-duplicates"},body:JSON.stringify({id:1,messages:list})});}
let loggedUser=sessionStorage.getItem('logged_user');let currentTab='dashboard';let authMode='register';let cachedUsers=[];let sliderInterval=null;
function calculateLevel(c){if(c>=100)return 8;if(c>=70)return 7;if(c>=60)return 6;if(c>=50)return 5;if(c>=30)return 4;if(c>=10)return 3;if(c>=6)return 2;return 1;}
window.addEventListener('DOMContentLoaded',()=>{let ref=new URLSearchParams(window.location.search).get('ref');if(ref)sessionStorage.setItem('temp_ref',ref);initApp();});
async function initApp(){cachedUsers=await fetchUsersFromDB();render();}
function switchTab(t){currentTab=t;document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));document.getElementById('tab-'+t).classList.add('active');render();}
function setAuthMode(m){authMode=m;render();}
async function render(){
let app=document.getElementById('app');let navUser=document.getElementById('nav-user');let bottomNav=document.getElementById('bottom-nav');
if(cachedUsers.length===0)cachedUsers=await fetchUsersFromDB();
let chats=await fetchChatsFromDB();
if(!loggedUser){bottomNav.style.display='none';navUser.innerText='Guest';let savedRef=sessionStorage.getItem('temp_ref')||'';if(authMode==='register'){app.innerHTML=`<div style="text-align:center;margin-bottom:20px"><h2 style="color:#60a5fa">💎 CashCraft</h2><p style="color:#93c5fd;font-size:13px">New Supabase Connected ✅</p></div><div class="slider-container"><div class="slide active" style="background-image:url('https://images.unsplash.com/photo-1579621970563-ebec7560ff3e')"><div class="slide-caption"><b>💰 Daily Earnings</b>$0.35 per day</div></div></div><div class="card"><h3>Create Account</h3><input id="r-name" placeholder="Full Name"/><input id="r-email" placeholder="Email"/><input id="r-pass" type="password" placeholder="Password"/><input id="r-ref" value="${savedRef}" placeholder="Referral Code"/><button class="btn" onclick="doRegister()">Register</button><div class="link-text" onclick="setAuthMode('login')">Already have account? Login</div><div id="auth-msg"></div></div>`;}else{app.innerHTML=`<div class="card"><h3>Login</h3><input id="l-email" value="Natasha.lee@gmail.com"/><input id="l-pass" type="password" value="NatashaAli12345"/><button class="btn" onclick="doLogin()">Login</button><div class="link-text" onclick="setAuthMode('register')">No account? Register</div><div id="auth-msg"></div></div>`;}return;}
let me=cachedUsers.find(u=>u.email.toLowerCase()===loggedUser.toLowerCase());if(!me){sessionStorage.removeItem('logged_user');loggedUser=null;return render();}
bottomNav.style.display='flex';navUser.innerText=me.name+' | $'+me.balance.toFixed(2);let team=cachedUsers.filter(u=>u.referredBy===me.ref);
if(currentTab==='dashboard'){let link=`https://cash-craft-arning.vercel.app?ref=${me.ref}`;app.innerHTML=`<div class="card"><h3>Dashboard</h3><p>Balance: $${me.balance.toFixed(2)}</p><p>Team: ${team.length}</p><input id="refLink" value="${link}" readonly/><button class="btn btn-success" onclick="navigator.clipboard.writeText('${link}');alert('Copied!')">Copy Link</button><button class="btn btn-danger" style="margin-top:10px" onclick="doLogout()">Logout</button></div><div class="card"><h3>Tasks</h3><button class="btn" onclick="doTask()">Complete $0.35 Task</button></div>`;}
else if(currentTab==='team'){let rows=team.map(t=>`<tr><td>${t.name}</td><td>${t.email}</td><td>$${t.balance.toFixed(2)}</td></tr>`).join('')||'<tr><td colspan=3>No team</td></tr>';app.innerHTML=`<div class="card"><h3>Team (${team.length})</h3><table><tr><th>Name</th><th>Email</th><th>Bal</th></tr>${rows}</table></div>`;}
else if(currentTab==='tasks'){app.innerHTML=`<div class="card"><h3>Tasks</h3><button class="btn" onclick="doTask()">Daily $0.35</button></div>`;}
else if(currentTab==='wallet'){let wh=(me.withdrawals||[]).map(x=>`<tr><td>$${x.amount}</td><td>${x.status}</td><td>${x.date}</td></tr>`).join('')||'<tr><td colspan=3>No withdraw</td></tr>';app.innerHTML=`<div class="card"><h3>Wallet $${me.balance.toFixed(2)}</h3><input id="w-amount" type="number" placeholder="Min $5"/><input id="w-address" placeholder="BEP20 Address"/><button class="btn btn-success" onclick="doWithdraw()">Withdraw</button><table><tr><th>Amt</th><th>Status</th><th>Date</th></tr>${wh}</table></div>`;}
else if(currentTab==='chat'){let msgs=chats.map(m=>`<div class="msg ${m.email===me.email?'msg-user':'msg-admin'}"><b>${m.name}:</b> ${m.text}</div>`).join('')||'No messages';app.innerHTML=`<div class="card"><h3>Chat</h3><div class="chat-messages">${msgs}</div><input id="chat-input" placeholder="Message"/><button class="btn" onclick="sendChat()">Send</button></div>`;}
else if(currentTab==='wheel'){app.innerHTML=`<div class="card" style="text-align:center"><h3>Wheel</h3><p>Spin cost $0.50</p><button class="btn btn-success" onclick="spinWheel()">SPIN</button><div id="wheel-msg"></div></div>`;}
}
async function doRegister(){let name=document.getElementById('r-name').value;let email=document.getElementById('r-email').value.toLowerCase();let pass=document.getElementById('r-pass').value;let ref=document.getElementById('r-ref').value;if(!name||!email||!pass)return alert('All fields');let myRef='CC'+Math.random().toString(36).substr(2,6).toUpperCase();let u={name,email,pass,balance:0,ref:myRef,referredBy:ref,count:0,level:1,lastTaskDate:'',withdrawals:[]};cachedUsers.push(u);if(ref){let p=cachedUsers.find(x=>x.ref===ref);if(p){p.balance+=1;p.count++;await saveSingleUser(p);}}await saveSingleUser(u);alert('Registered! Login now');authMode='login';render();}
async function doLogin(){let email=document.getElementById('l-email').value.toLowerCase();let pass=document.getElementById('l-pass').value;let u=cachedUsers.find(x=>x.email.toLowerCase()===email&&x.pass===pass);if(!u)return alert('Invalid');sessionStorage.setItem('logged_user',u.email);loggedUser=u.email;render();}
function doLogout(){sessionStorage.removeItem('logged_user');loggedUser=null;render();}
async function doTask(){let me=cachedUsers.find(u=>u.email.toLowerCase()===loggedUser.toLowerCase());let today=new Date().toDateString();if(me.lastTaskDate===today)return alert('Done today');me.balance+=0.35;me.lastTaskDate=today;await saveSingleUser(me);render();}
async function doWithdraw(){let amt=parseFloat(document.getElementById('w-amount').value);let addr=document.getElementById('w-address').value;if(amt<5)return alert('Min $5');let me=cachedUsers.find(u=>u.email.toLowerCase()===loggedUser.toLowerCase());if(me.balance<amt)return alert('Low bal');me.balance-=amt;me.withdrawals.push({amount:amt,status:'Pending',date:new Date().toLocaleDateString(),address:addr});await saveSingleUser(me);render();}
async function sendChat(){let text=document.getElementById('chat-input').value;if(!text)return;let me=cachedUsers.find(u=>u.email.toLowerCase()===loggedUser.toLowerCase());let chats=await fetchChatsFromDB();chats.push({email:me.email,name:me.name,text,time:new Date().toLocaleString()});await saveChatsToDB(chats);render();}
async function spinWheel(){let me=cachedUsers.find(u=>u.email.toLowerCase()===loggedUser.toLowerCase());if(me.balance<0.5)return alert('Need $0.50');me.balance-=0.5;let rewards=[0,0.1,0.2,0.5,0,1];let r=rewards[Math.floor(Math.random()*rewards.length)];me.balance+=r;await saveSingleUser(me);document.getElementById('wheel-msg').innerText='Won $'+r;render();}
</script>
</body>
</html>
