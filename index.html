<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CashCraft - Spin & Investment Platform</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0b0f19; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #111827; padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        h1, h2 { text-align: center; color: #f3f4f6; }
        .box { background: #1f2937; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .error { background: #991b1b; color: #fca5a5; padding: 10px; border-radius: 5px; text-align: center; margin-bottom: 15px; }
        .success { background: #065f46; color: #6ee7b7; padding: 10px; border-radius: 5px; text-align: center; margin-bottom: 15px; }
        
        /* Wheel CSS */
        .wheel-wrap { text-align: center; position: relative; display: inline-block; }
        canvas { background: #374151; border-radius: 50%; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .pointer {
            position: absolute; top: -5px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 15px solid transparent;
            border-right: 15px solid transparent; border-bottom: 30px solid #f59e0b; z-index: 10;
        }
        .spin-btn { background: #f59e0b; color: #000; border: none; padding: 12px 35px; font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer; margin-top: 15px; }
        .spin-btn:disabled { background: #4b5563; cursor: not-allowed; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #374151; padding: 8px; text-align: center; font-size: 13px; }
        th { background: #111827; color: #9ca3af; }
        input, select { padding: 6px; background: #374151; color: #fff; border: 1px solid #4b5563; border-radius: 4px; width: 100%; box-sizing: border-box; margin-bottom: 8px; }
        button { background: #2563eb; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .chat-box { height: 150px; overflow-y: scroll; background: #111827; padding: 10px; border: 1px solid #374151; border-radius: 4px; margin-bottom: 10px; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <h1>CashCraft Spin & Investment Platform</h1>

    <div id="app">
        <!-- Dynamic Content will load here via JavaScript -->
    </div>
</div>

<script>
    // Initialize LocalStorage Database if not exists
    if (!localStorage.getItem('users')) {
        localStorage.setItem('users', JSON.stringify([
            { name: 'Admin', email: 'admin@gmail.com', pass: 'admin1234', balance: 0, investment: 0, profit: 0, approved: 1, ref: 'ADMIN', count: 0, level: 1 }
        ]));
    }
    if (!localStorage.getItem('admin_rig')) localStorage.setItem('admin_rig', '');
    if (!localStorage.getItem('chats')) localStorage.setItem('chats', JSON.stringify([]));

    let loggedUser = sessionStorage.getItem('logged_user');

    function render() {
        let app = document.getElementById('app');
        if (!loggedUser) {
            // LOGIN & REGISTER VIEW
            app.innerHTML = `
                <div style="display: flex; gap: 20px;">
                    <div class="box" style="flex: 1;">
                        <h2>Login</h2>
                        <input type="email" id="log_email" placeholder="Gmail / Email">
                        <input type="password" id="log_pass" placeholder="Password">
                        <button onclick="login()" style="width:100%; margin-top:10px;">Login</button>
                    </div>
                    <div class="box" style="flex: 1;">
                        <h2>Register</h2>
                        <input type="text" id="reg_name" placeholder="Full Name">
                        <input type="email" id="reg_email" placeholder="Gmail / Email">
                        <input type="password" id="reg_pass" placeholder="Password">
                        <input type="text" id="reg_ref" placeholder="Referral Code (Optional)">
                        <button onclick="register()" style="background:#059669; width:100%; margin-top:10px;">Register</button>
                    </div>
                </div>`;
        } else if (loggedUser === 'admin@gmail.com') {
            // ADMIN PANEL VIEW
            let users = JSON.parse(localStorage.getItem('users'));
            let forced = localStorage.getItem('admin_rig');
            let chats = JSON.parse(localStorage.getItem('chats'));

            let usersHtml = '';
            users.forEach((u, index) => {
                if(u.email !== 'admin@gmail.com') {
                    usersHtml += `<tr>
                        <td>${u.name}</td>
                        <td>${u.email}</td>
                        <td>$${u.investment}</td>
                        <td>$${u.profit}</td>
                        <td><b>${u.count} refs</b> (Lvl ${u.level})</td>
                        <td>$${u.balance}</td>
                        <td>${u.approved == 1 ? '<span style="color:#34d399">Active</span>' : '<span style="color:#f87171">Pending</span>'}</td>
                        <td>${u.approved == 0 ? `<button onclick="approveUser(${index})" style="background:#059669; padding:4px 8px;">Approve</button>` : 'Approved'}</td>
                    </tr>`;
                }
            });

            app.innerHTML = `
                <div class="box" style="border: 2px dashed #f59e0b;">
                    <h2 style="color: #f59e0b;">👑 Admin Master Control Panel</h2>
                    <p style="text-align: right;"><a href="#" onclick="logout()" style="color: #f87171;">Logout Admin</a></p>

                    <div style="background: #111827; padding: 15px; border-radius: 6px; margin-bottom: 15px;">
                        <h3>1. Force Next Spin Result (Cash Wheel Rigging)</h3>
                        <select id="force_val">
                            <option value="">-- Random (Normal) --</option>
                            <option value="6">$6</option><option value="10">$10</option><option value="15">$15</option>
                            <option value="20">$20</option><option value="25">$25</option><option value="35">$35</option>
                            <option value="50">$50</option><option value="85">$85</option><option value="100">$100</option>
                        </select>
                        <button onclick="setRig()" style="background: #d97706;">Lock Next Prize</button>
                        <p style="font-size: 12px; color: #9ca3af; margin-top: 5px;">Currently Forced: <b>${forced ? '$'+forced : 'None (Random)'}</b></p>
                    </div>

                    <div style="background: #111827; padding: 15px; border-radius: 6px; margin-bottom: 15px;">
                        <h3>2. Registered Users & Approvals</h3>
                        <table>
                            <tr><th>Name</th><th>Email</th><th>Investment</th><th>Daily Profit</th><th>Refs / Level</th><th>Balance</th><th>Status</th><th>Action</th></tr>
                            ${usersHtml}
                        </table>
                    </div>
                </div>`;
        } else {
            // USER DASHBOARD VIEW
            let users = JSON.parse(localStorage.getItem('users'));
            let u = users.find(x => x.email === loggedUser);

            app.innerHTML = `
                <div class="box">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <h3>Welcome, ${u.name} | Balance: $<span id="user-bal">${u.balance}</span></h3>
                        <a href="#" onclick="logout()" style="color: #f87171;">Logout</a>
                    </div>
                    <p><b>Your Referral Code:</b> <span style="color:#f59e0b;">${u.ref}</span> | Total Referrals: <b>${u.count}</b> | <span style="color:#38bdf8;">Level: ${u.level}</span></p>

                    ${u.approved == 0 ? `
                        <div style="background: #7f1d1d; padding: 15px; border-radius: 6px; margin-bottom: 15px;">
                            <h4>⚠️ Investment Locked! Please select amount and submit.</h4>
                            <select id="inv_amt">
                                <option value="10">$10 (Daily Profit: $0.35)</option>
                                <option value="15">$15 (Daily Profit: $0.40)</option>
                                <option value="40">$40 (Daily Profit: $0.50)</option>
                                <option value="100">$100 (Daily Profit: $1.00)</option>
                            </select>
                            <input type="file" id="inv_file">
                            <button onclick="submitInvestment()" style="background: #d97706; margin-top: 10px;">Submit Investment Proof</button>
                        </div>
                    ` : `<div class="success">✅ Investment Approved! Daily Profit: $${u.profit}/day.</div>`}

                    <div style="text-align: center; margin-top: 20px;">
                        <h3>Lucky Cash Spin Wheel</h3>
                        ${u.approved == 0 ? `<div class="error">🔒 Wheel is locked until admin approves your investment!</div><div style="opacity: 0.3; pointer-events: none;">` : `<div>`}
                        <div class="wheel-wrap">
                            <div class="pointer"></div>
                            <canvas id="wheel" width="300" height="300"></canvas>
                        </div>
                        <br>
                        <button class="spin-btn" id="spinBtn" onclick="spinWheel()">SPIN NOW</button>
                        <h3 id="spinResult" style="color: #f59e0b; margin-top: 10px;"></h3>
                        </div>
                    </div>
                </div>`;
            setTimeout(initWheel, 100);
        }
    }

    function register() {
        let name = document.getElementById('reg_name').value;
        let email = document.getElementById('reg_email').value;
        let pass = document.getElementById('reg_pass').value;
        let refIn = document.getElementById('reg_ref').value;

        if(!name || !email || !pass) { alert('Fill all fields!'); return; }
        let users = JSON.parse(localStorage.getItem('users'));
        if(users.some(x => x.email === email)) { alert('Email already exists!'); return; }

        let refCode = 'REF' + Math.floor(1000 + Math.random() * 9000);
        let newUser = { name, email, pass, balance: 0, investment: 0, profit: 0, approved: 0, ref: refCode, count: 0, level: 1 };

        if(refIn) {
            let refUser = users.find(x => x.ref === refIn);
            if(refUser) {
                refUser.count += 1;
                if(refUser.count >= 40) refUser.level = 7;
                else if(refUser.count >= 30) refUser.level = 6;
                else if(refUser.count >= 20) refUser.level = 5;
                else if(refUser.count >= 15) refUser.level = 4;
                else if(refUser.count >= 10) refUser.level = 3;
                else if(refUser.count >= 5) refUser.level = 2;
            }
        }
        users.push(newUser);
        localStorage.setItem('users', JSON.stringify(users));
        alert('Registration successful! Please login.');
        render();
    }

    function login() {
        let email = document.getElementById('log_email').value;
        let pass = document.getElementById('log_pass').value;
        let users = JSON.parse(localStorage.getItem('users'));
        let u = users.find(x => x.email === email && x.pass === pass);
        if(u) {
            loggedUser = u.email;
            sessionStorage.setItem('logged_user', loggedUser);
            render();
        } else {
            alert('Invalid credentials!');
        }
    }

    function logout() {
        loggedUser = null;
        sessionStorage.removeItem('logged_user');
        render();
    }

    function submitInvestment() {
        let amt = parseFloat(document.getElementById('inv_amt').value);
        let profit = amt === 10 ? 0.35 : amt === 15 ? 0.40 : amt === 40 ? 0.50 : 1.00;
        let users = JSON.parse(localStorage.getItem('users'));
        let u = users.find(x => x.email === loggedUser);
        u.investment = amt;
        u.profit = profit;
        u.approved = 0;
        localStorage.setItem('users', JSON.stringify(users));
        alert('Investment submitted! Waiting for admin approval.');
        render();
    }

    function approveUser(index) {
        let users = JSON.parse(localStorage.getItem('users'));
        users[index].approved = 1;
        localStorage.setItem('users', JSON.stringify(users));
        render();
    }

    function setRig() {
        let val = document.getElementById('force_val').value;
        localStorage.setItem('admin_rig', val);
        alert('Next prize locked!');
        render();
    }

    // Wheel Code
    const prizes = ['$6', '$10', '$15', '$20', '$25', '$35', '$50', '$85', '$100'];
    const colors = ['#ef4444', '#f97316', '#eab308', '#84cc16', '#10b981', '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899'];
    let startAngle = 0;
    let isSpinning = false;

    function initWheel() {
        let canvas = document.getElementById('wheel');
        if(!canvas) return;
        let ctx = canvas.getContext('2d');
        let numSegments = prizes.length;
        let arcSize = (2 * Math.PI) / numSegments;

        function draw() {
            ctx.clearRect(0, 0, 300, 300);
            for (let i = 0; i < numSegments; i++) {
                let angle = startAngle + i * arcSize;
                ctx.beginPath();
                ctx.fillStyle = colors[i];
                ctx.moveTo(150, 150);
                ctx.arc(150, 150, 140, angle, angle + arcSize, false);
                ctx.lineTo(150, 150);
                ctx.fill();
                ctx.save();
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 14px Arial";
                ctx.translate(150 + Math.cos(angle + arcSize / 2) * 90, 150 + Math.sin(angle + arcSize / 2) * 90);
                ctx.rotate(angle + arcSize / 2 + Math.PI / 2);
                ctx.fillText(prizes[i], -ctx.measureText(prizes[i]).width / 2, 0);
                ctx.restore();
            }
        }
        draw();
    }

    function spinWheel() {
        if (isSpinning) return;
        isSpinning = true;
        document.getElementById('spinBtn').disabled = true;
        document.getElementById('spinResult').innerText = "Spinning...";

        let forced = localStorage.getItem('admin_rig');
        let winningAmt = 6;
        let rawPrizes = [6, 10, 15, 20, 25, 35, 50, 85, 100];
        if(forced && rawPrizes.includes(parseInt(forced))) {
            winningAmt = parseInt(forced);
            localStorage.setItem('admin_rig', ''); // reset
        } else {
            winningAmt = rawPrizes[Math.floor(Math.random() * rawPrizes.length)];
        }

        let winningIndex = rawPrizes.indexOf(winningAmt);
        let numSegments = prizes.length;
        let arcSize = (2 * Math.PI) / numSegments;
        let targetAngle = 2 * Math.PI - (winningIndex * arcSize + arcSize / 2);
        let finalAngle = (6 * 2 * Math.PI) + targetAngle;

        let currentRotation = 0;
        let canvas = document.getElementById('wheel');
        let ctx = canvas.getContext('2d');

        let interval = setInterval(() => {
            currentRotation += 0.3;
            startAngle += 0.3;
            
            // redraw
            ctx.clearRect(0, 0, 300, 300);
            for (let i = 0; i < numSegments; i++) {
                let angle = startAngle + i * arcSize;
                ctx.beginPath();
                ctx.fillStyle = colors[i];
                ctx.moveTo(150, 150);
                ctx.arc(150, 150, 140, angle, angle + arcSize, false);
                ctx.lineTo(150, 150);
                ctx.fill();
                ctx.save();
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 14px Arial";
                ctx.translate(150 + Math.cos(angle + arcSize / 2) * 90, 150 + Math.sin(angle + arcSize / 2) * 90);
                ctx.rotate(angle + arcSize / 2 + Math.PI / 2);
                ctx.fillText(prizes[i], -ctx.measureText(prizes[i]).width / 2, 0);
                ctx.restore();
            }

            if (currentRotation >= finalAngle) {
                clearInterval(interval);
                isSpinning = false;
                document.getElementById('spinBtn').disabled = false;
                document.getElementById('spinResult').innerText = "🎉 You Won: $" + winningAmt;

                let users = JSON.parse(localStorage.getItem('users'));
                let u = users.find(x => x.email === loggedUser);
                u.balance += winningAmt;
                localStorage.setItem('users', JSON.stringify(users));
                document.getElementById('user-bal').innerText = u.balance;
            }
        }, 20);
    }

    render();
</script>

</body>
</html>
